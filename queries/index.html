<html lang="en">
<head>

    <style>
        .query-card {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            background: var(--bg-secondary);
            padding: 1.5rem;
            margin-bottom: 1rem;
        }
        .query-card:hover {
            transform: translateY(-4px);
            border-color: var(--accent-primary);
            box-shadow: 0 10px 30px -10px rgba(35, 134, 54, 0.2);
        }
        .query-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.5rem;
        }
        .query-title {
            font-weight: 600;
            font-size: 1.1rem;
        }
        .query-meta {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 1.25rem;
            color: var(--text-secondary);
            font-size: 0.85rem;
            margin-top: 1rem;
            padding-top: 1rem;
            border-top: 1px solid var(--border-color);
        }
        .query-meta > span {
            display: flex;
            align-items: center;
            gap: 0.35rem;
        }
    </style>

                        <div class="skeleton skeleton-text mb-3" style="height: 0.95rem; width: 60%;"></div>

                        </div>
                    </div>
                    <div>
                        <hr style="border: none; border-top: 1px solid rgba(255,255,255,0.05); margin: 1rem 0;">
                        <div style="display: flex; gap: 1rem; align-items: center; justify-content: space-between;">
                            <div style="display: flex; gap: 1rem;">
                                <div class="skeleton skeleton-text" style="height: 0.8rem; width: 80px;"></div>

                            </div>

                    </div>
                </div>

                    <div>

                            <div style="display: flex; flex-direction: column; gap: 0.4rem; width: 70%;">
                                <div class="skeleton skeleton-text" style="height: 0.75rem; width: 60px; border-radius: 2px;"></div>
                                <div class="skeleton skeleton-text" style="height: 1.25rem; width: 90%; border-radius: 4px;"></div>
                            </div>
                            <div class="skeleton skeleton-stat" style="height: 1.5rem; width: 60px; border-radius: 20px; flex-shrink: 0;"></div>

                        <div class="skeleton skeleton-text mt-3 mb-2" style="height: 0.95rem; width: 70%;"></div>
                        <div class="skeleton skeleton-text mb-3" style="height: 0.95rem; width: 50%;"></div>

                            <div class="skeleton skeleton-stat tag-badge" style="width: 70px; height: 20px; border-radius: 10px;"></div>
                        </div>

                        <div style="display: flex; gap: 1rem; align-items: center; justify-content: space-between;">

                                <div class="skeleton skeleton-text" style="height: 0.8rem; width: 100px;"></div>
                            </div>
                        </div>

                </div>
                <div class="card w-full" style="padding: 1.5rem; display: flex; flex-direction: column; justify-content: space-between;">
                    <div>

                                <div class="skeleton skeleton-text" style="height: 0.75rem; width: 60px; border-radius: 2px;"></div>
                                <div class="skeleton skeleton-text" style="height: 1.25rem; width: 60%; border-radius: 4px;"></div>
                            </div>
                            <div class="skeleton skeleton-stat" style="height: 1.5rem; width: 60px; border-radius: 20px; flex-shrink: 0;"></div>
                        </div>

                        <div class="skeleton skeleton-text mb-3" style="height: 0.95rem; width: 80%;"></div>

    <!-- View Query Details Modal -->
    <div class="modal-overlay" id="view-query-modal">
        <div class="modal" style="max-width: 550px;">
            <div class="modal-header">
                <h3 id="view-query-title-head">Query Details</h3>
                <button class="modal-close" onclick="document.getElementById('view-query-modal').classList.remove('active')"><i class="ph ph-x"></i></button>
            </div>
            <div style="display: flex; flex-direction: column; gap: 1rem;">
                <div>
                    <input type="hidden" id="view-query-id">
                    <h4 id="view-query-title" style="color: white; font-size: 1.1rem; margin-bottom: 0.25rem; line-height: 1.4;"></h4>
                    <div style="display: flex; gap: 0.5rem; flex-wrap: wrap;">
                        <span id="view-query-cat" class="badge" style="text-transform: capitalize;">Category</span>
                        <span id="view-query-status" class="badge" style="text-transform: capitalize;">Status</span>
                    </div>
                </div>
                <div style="background-color: var(--bg-tertiary); border: 1px solid var(--border-color); padding: 1rem; border-radius: 6px;">
                    <p id="view-query-body" style="white-space: pre-wrap; font-size: 0.9rem; color: var(--text-primary); line-height: 1.5;"></p>
                </div>
                <div style="border-top: 1px solid var(--border-color); padding-top: 1rem;">
                    <h4 style="font-size: 0.95rem; color: white; margin-bottom: 0.75rem;">Replies</h4>
                    <div id="view-query-replies" style="max-height: 180px; overflow-y: auto; display: flex; flex-direction: column; gap: 0.5rem; margin-bottom: 1rem;">
                        <!-- Replies -->
                    </div>
                    <form id="query-reply-form" style="display: flex; flex-direction: column; gap: 0.5rem;">
                        <textarea id="query-reply-input" class="form-control" rows="2" placeholder="Type your reply here..." required></textarea>
                        <button type="submit" class="btn btn-primary" style="align-self: flex-end;">Send Reply</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Create Query Modal -->
    <div class="modal-overlay" id="create-query-modal">
        <div class="modal">
            <div class="modal-header">
                <h3>Raise New Query</h3>
                <button class="modal-close"><i class="ph ph-x"></i></button>
            </div>
            <form id="new-query-form">
                <div class="form-group">
                    <label class="form-label">Query Title</label>
                    <input type="text" id="query-title" class="form-control" placeholder="Brief summary of issue" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Category</label>
                    <select id="query-category" class="form-control" required>
                        <option value="git_help">Git Help</option>
                        <option value="repo_bug">Repo Bug</option>
                        <option value="website_bug">Website Bug</option>
                        <option value="general">General Support</option>
                    </select>
                </div>
                <div class="form-group mb-3">
                    <label class="form-label">Description</label>
                    <textarea id="query-desc" class="form-control" rows="4" placeholder="Detailed explanation..." required></textarea>
                </div>
                <button type="submit" class="btn btn-primary btn-block" id="submit-query-btn">Submit Query</button>
            </form>
        </div>
    </div>

    <script src="/js/api.js"></script>
    <script src="/js/components.js"></script>
    <script src="/js/notifications.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            if (!API.isAuthenticated()) {
                window.location.href = '/login/';
                return;
            }

            Components.renderSidebar('queries');
            Components.setupModal('create-query-modal', 'create-query-btn', 'modal-close');

            let allQueries = [];
            let currentFilter = 'all';

            Components.renderSearchFilterBar({
                containerId: 'search-filter-container',
                search: {
                    id: 'queries-search',
                    placeholder: 'Search queries by title or description...'
                },
                filters: [
                    {
                        id: 'filter-queries-status',
                        icon: 'ph-funnel',
                        optionsHtml: `
                            <option value="all">All Queries</option>
                            <option value="open">Status: Open</option>
                            <option value="resolved">Status: Resolved</option>
                        `
                    }
                ]
            });

            const queriesSearchInput = document.getElementById('queries-search');
            const queriesStatusFilter = document.getElementById('filter-queries-status');

            const renderQueries = () => {
                const listContainer = document.getElementById('queries-list');
                if (!listContainer) return;
                listContainer.innerHTML = '';

                const searchQuery = queriesSearchInput ? queriesSearchInput.value.toLowerCase().trim() : '';

                const filtered = allQueries.filter(q => {
                    if (currentFilter === 'open' && q.status !== 'open' && q.status !== 'answered') return false;
                    if (currentFilter === 'resolved' && q.status !== 'resolved') return false;
                    
                    if (searchQuery) {
                        const matchTitle = q.title && q.title.toLowerCase().includes(searchQuery);
                        const matchBody = q.body && q.body.toLowerCase().includes(searchQuery);
                        if (!matchTitle && !matchBody) return false;
                    }
                    return true;
                });

                if (filtered.length === 0) {
                    listContainer.innerHTML = `<div class="text-secondary text-center py-4" style="grid-column: 1 / -1; display: flex; flex-direction: column; align-items: center;">No ${currentFilter !== 'all' ? currentFilter : ''} queries found.</div>`;
                    return;
                }

                filtered.forEach(q => {
                    let priorityClass = 'priority-low';
                    if (q.status === 'open') {
                        priorityClass = 'priority-high';
                    } else if (q.status === 'answered') {
                        priorityClass = 'priority-medium';
                    }
                    const statStyles = Components.getTagStyles(q.status || 'unknown');
                    const catStyles = Components.getTagStyles(q.category || 'unknown');
                    
                    // Format date
                    let dateStr = API.formatDateTime(q.created_at);
                    
                    // Category formatting
                    let catLabel = q.category;
                    if (q.category === 'git_help') catLabel = 'Git Help';
                    else if (q.category === 'repo_bug') catLabel = 'Repo Bug';
                    else if (q.category === 'website_bug') catLabel = 'Website Bug';
                    else if (q.category === 'general') catLabel = 'General Support';

                    const div = document.createElement('div');
                    div.className = `card query-card ${priorityClass}`;
                    div.innerHTML = `
                        <div class="query-header">
                            <h3 class="query-title" style="margin: 0; font-size: 1.15rem;">${q.title}</h3>
                            <span class="badge" style="background-color: ${statStyles.bg}; color: ${statStyles.text}; border: 1px solid ${statStyles.border}; padding: 0.4rem 0.8rem; font-size: 0.75rem; border-radius: 20px;">${q.status.charAt(0).toUpperCase() + q.status.slice(1)}</span>
                        </div>
                        <p class="text-secondary" style="font-size: 0.95rem; margin-top: 0.75rem; margin-bottom: 0.5rem; line-height: 1.5; white-space: pre-wrap;">${q.body}</p>
                        <div class="query-meta">
                            <span><i class="ph ph-calendar-blank text-secondary"></i> <span class="text-secondary">${dateStr}</span></span>
                            <span><i class="ph ph-tag text-primary"></i> Category: <strong style="color: ${catStyles.text};">${catLabel}</strong></span>
                        </div>
                    `;
                    div.addEventListener('click', () => viewQueryDetail(q.id));
                    listContainer.appendChild(div);
                });
            };

            const viewQueryDetail = async (queryId) => {
                const modal = document.getElementById('view-query-modal');
                const title = document.getElementById('view-query-title');
                const cat = document.getElementById('view-query-cat');
                const status = document.getElementById('view-query-status');
                const body = document.getElementById('view-query-body');
                const repliesList = document.getElementById('view-query-replies');

                document.getElementById('view-query-id').value = queryId;
                repliesList.innerHTML = '<div class="loading-container py-3"><i class="ph ph-spinner-gap loading-spinner text-primary" style="font-size: 1.5rem;"></i><p class="text-secondary mt-2">Loading replies...</p></div>';
                modal.classList.add('active');

                try {
                    const res = await API.request(`/queries/${queryId}`);
                    const q = res.query;
                    const replies = res.replies;

                    title.textContent = q.title;
                    body.textContent = q.body;
                    
                    let catLabel = q.category;
                    if (q.category === 'git_help') catLabel = 'Git Help';
                    else if (q.category === 'repo_bug') catLabel = 'Repo Bug';
                    else if (q.category === 'website_bug') catLabel = 'Website Bug';
                    else if (q.category === 'general') catLabel = 'General Support';
                    cat.textContent = catLabel;

                    status.textContent = q.status.toUpperCase();
                    const catS = Components.getTagStyles(q.category);
                    cat.style.backgroundColor = catS.bg;
                    cat.style.color = catS.text;
                    cat.style.border = `1px solid ${catS.border}`;

                    const statS = Components.getTagStyles(q.status);
                    status.style.backgroundColor = statS.bg;
                    status.style.color = statS.text;
                    status.style.border = `1px solid ${statS.border}`;

                    repliesList.innerHTML = '';
                    if (replies && replies.length > 0) {
                        replies.forEach(r => {
                            const div = document.createElement('div');
                            div.style.padding = '0.5rem 0.75rem';
                            div.style.backgroundColor = 'var(--bg-secondary)';
                            div.style.border = '1px solid var(--border-color)';
                            div.style.borderRadius = '6px';
                            const authorName = r.author_name || r.author_github || 'User';
                            div.innerHTML = `
                                <div style="font-size: 0.75rem; color: var(--text-secondary); display: flex; justify-content: space-between; margin-bottom: 0.25rem;">
                                    <strong>${authorName}</strong>
                                    <span>${API.formatDateTime(r.created_at)}</span>
                                </div>
                                <div style="font-size: 0.85rem; color: var(--text-primary); white-space: pre-wrap; line-height: 1.4;">${r.message}</div>
                            `;
                            repliesList.appendChild(div);
                        });
                    } else {
                        repliesList.innerHTML = '<div style="font-size: 0.75rem; color: var(--text-secondary); text-align: center; padding: 1rem;">No replies yet.</div>';
                    }
                } catch (e) {
                    repliesList.innerHTML = `<div style="font-size: 0.75rem; color: var(--danger-color); text-align: center; padding: 1rem;">Error: ${e.message}</div>`;
                }
            };

            let currentPage = 1;
            let currentLimit = 10;

            const loadQueries = async () => {
                try {
                    const res = await API.fetchQueries(currentPage, currentLimit);
                    allQueries = res.data || [];
                    renderQueries();
                    
                    Components.renderPagination('queries-pagination', res.meta, (p) => {
                        currentPage = p;
                        loadQueries();
                    }, (l) => {
                        currentLimit = l;
                        currentPage = 1;
                        loadQueries();
                    });
                } catch (err) {
                    console.error(err);
                    Components.showToast("Failed to fetch queries.", "error");
                }
            };

            if (queriesSearchInput) {
                queriesSearchInput.addEventListener('input', renderQueries);
            }

            await loadQueries();

            // Set up filter
            if (queriesStatusFilter) {
                queriesStatusFilter.addEventListener('change', (e) => {
                    currentFilter = e.target.value;
                    renderQueries();
                });
            }

            // Handle submission of query
            const form = document.getElementById('new-query-form');
            if (form) {
                form.addEventListener('submit', async (e) => {
                    e.preventDefault();
                    const title = document.getElementById('query-title').value.trim();
                    const category = document.getElementById('query-category').value;
                    const body = document.getElementById('query-desc').value.trim();
                    const submitBtn = document.getElementById('submit-query-btn');
                    
                    submitBtn.disabled = true;
                    submitBtn.textContent = "Submitting...";
                    
                    try {
                        await API.createQuery(title, body, category);
                        Components.showToast("Query raised successfully!", "success");
                        form.reset();
                        document.getElementById('create-query-modal').classList.remove('active');
                        await loadQueries();
                    } catch (err) {
                        Components.showToast(err.message || "Failed to submit query.", "error");
                    } finally {
                        submitBtn.disabled = false;
                        submitBtn.textContent = "Submit Query";
                    }
                });
            }

            // Wire reply form submit
            const replyForm = document.getElementById('query-reply-form');
            if (replyForm) {
                replyForm.addEventListener('submit', async (e) => {
                    e.preventDefault();
                    const queryId = document.getElementById('view-query-id').value;
                    const message = document.getElementById('query-reply-input').value.trim();
                    const replyBtn = replyForm.querySelector('button[type="submit"]');

                    if (!message || !queryId) return;

                    replyBtn.disabled = true;
                    replyBtn.textContent = 'Sending...';

                    try {
                        await API.replyQuery(queryId, message);
                        document.getElementById('query-reply-input').value = '';
                        Components.showToast('Reply submitted successfully!', 'success');
                        await viewQueryDetail(queryId);
                    } catch (err) {
                        Components.showToast('Failed to send reply: ' + err.message, 'error');
                    } finally {
                        replyBtn.disabled = false;
                        replyBtn.textContent = 'Send Reply';
                    }
                });
            }
        });
    </script>
