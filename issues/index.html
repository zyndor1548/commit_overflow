    <style>
        .issues-controls {
            display: flex;
            gap: 1rem;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
        }
        .issue-card {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            background: var(--bg-secondary);
            padding: 1.5rem;
        }
        .issue-card:hover {
            transform: translateY(-4px);
            border-color: var(--accent-primary);
            box-shadow: 0 10px 30px -10px rgba(35, 134, 54, 0.2);
        }

        .issue-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 1rem;
            margin-bottom: 0.5rem;
        }
        .issue-title-area h3 {
            font-size: 1.15rem;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }
        .issue-title-area h3 a {
            color: var(--text-primary);
        }
        .issue-title-area h3 a:hover {
            color: var(--accent-primary-hover);
            text-decoration: underline;
        }
        .issue-repo {
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--accent-secondary);
        }
        .issue-repo:hover {
            text-decoration: underline;
        }
        .issue-meta-info {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 1.25rem;
            font-size: 0.85rem;
            color: var(--text-secondary);
            margin-top: 1rem;
            padding-top: 1rem;
            border-top: 1px solid var(--border-color);
        }
        .issue-meta-info > span {
            display: flex;
            align-items: center;
            gap: 0.35rem;
        }
        .label-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin-top: 0.75rem;
        }
        .tag-badge {
            background-color: var(--bg-tertiary);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
            padding: 0.15rem 0.5rem;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 500;
        }
    </style>
</head>

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            if (!API.isAuthenticated()) {
                window.location.href = '/login/';
                return;
            }

            Components.renderSidebar('issues');

            let allIssues = [];
            let allLabels = [];
            let activeTab = 'open'; // 'open', 'closed', 'assigned'
            const user = API.getCurrentUser();

            const searchInput = document.getElementById('issues-search');
            const labelFilter = document.getElementById('filter-label');
            const typeFilter = document.getElementById('filter-type');
            const issuesListContainer = document.getElementById('issues-list');

            const renderIssues = () => {
                const searchQuery = searchInput.value.toLowerCase().trim();
                const selectedLabel = labelFilter.value;

                // The backend already filtered by activeTab, so we just do search and label here
                let filtered = allIssues;

                // 2. Filter by Search Query
                if (searchQuery) {
                    filtered = filtered.filter(issue => 
                        issue.title.toLowerCase().includes(searchQuery) ||
                        issue.body.toLowerCase().includes(searchQuery)
                    );
                }

                // 3. Filter by Label
                if (selectedLabel) {
                    filtered = filtered.filter(issue => 
                        issue.labels && issue.labels.includes(selectedLabel)
                    );
                }

                if (filtered.length === 0) {
                    issuesListContainer.innerHTML = `
                        <div class="text-center py-4 text-secondary" style="grid-column: 1 / -1; display: flex; flex-direction: column; align-items: center;">
                            <i class="ph ph-tray" style="font-size: 2.5rem;"></i>
                            <p class="mt-1">No issues found.</p>
                        </div>
                    `;
                    return;
                }

                issuesListContainer.innerHTML = '';
                filtered.forEach(issue => {
                    const card = document.createElement('div');
                    card.className = `card issue-card status-${issue.status}`;
                    
                    // Format difficulty badge
                    let diffClass = 'badge-info';
                    if (issue.difficulty === 'easy') diffClass = 'badge-success';
                    if (issue.difficulty === 'hard') diffClass = 'badge-danger';

                    // Format deadline
                    const deadlineText = issue.deadline_at 
                        ? API.formatDateTime(issue.deadline_at)
                        : 'No Deadline';

                    // Format timing fields
                    const createdText = issue.created_at
                        ? API.formatDateTime(issue.created_at)
                        : 'N/A';
                    const assignedText = issue.assigned_at
                        ? API.formatDateTime(issue.assigned_at)
                        : 'N/A';
                    const startedText = issue.started_at
                        ? API.formatDateTime(issue.started_at)
                        : 'N/A';
                    const finishedText = issue.finished_at
                        ? API.formatDateTime(issue.finished_at)
                        : 'N/A';

                    let durationText = 'N/A';
                    if (issue.duration_seconds !== undefined && issue.duration_seconds !== null) {
                        const totalSecs = issue.duration_seconds;
                        const hrs = Math.floor(totalSecs / 3600);
                        const mins = Math.floor((totalSecs % 3600) / 60);
                        if (hrs > 0) {
                            durationText = `${hrs}h ${mins}m`;
                        } else {
                            durationText = `${mins}m`;
                        }
                    }

                    // Render Labels
                    let labelHtml = '';
                    if (issue.labels && issue.labels.length > 0) {
                        labelHtml = `<div class="label-tags">` + 
                             issue.labels.map(lbl => `<span class="tag-badge">${lbl}</span>`).join('') +
                            `</div>`;
                    }

                    // Format issue link — GitLab uses /-/issues/IID, GitHub uses /issues/ID
                    const isGitLab = issue.repo_url && issue.repo_url.includes('gitlab.com');
                    const issueNumber = issue.github_issue_id || 0; // github_issue_id from backend
                    const issueLink = isGitLab
                        ? `${issue.repo_url}/-/issues/${issueNumber}`
                        : `${issue.repo_url}/issues/${issueNumber}`;

                    let metaHtml = `
                        <div class="issue-meta-info">
                            <span><i class="ph ph-user text-primary"></i> Creator: <strong>${issue.user_id === user.id ? 'You' : 'System'}</strong></span>
                            <span><i class="ph ph-user-focus ${issue.assignee_id ? 'text-success' : 'text-secondary'}"></i> Assignee: <strong style="${issue.assignee_id ? '' : 'color: var(--text-secondary); font-weight: normal;'}">${issue.assignee_id ? (issue.assignee_id === user.id ? 'You' : 'Assigned') : 'Unassigned'}</strong></span>
                    `;
                    
                    if (issue.deadline_at) metaHtml += `<span><i class="ph ph-calendar-blank text-warning"></i> Deadline: ${deadlineText}</span>`;
                    
                    if (issue.finished_at) {
                        metaHtml += `<span><i class="ph ph-check-circle" style="color: #3fb950;"></i> Finished: ${finishedText}</span>`;
                        if (durationText !== 'N/A') metaHtml += `<span><i class="ph ph-timer" style="color: #a371f7;"></i> Duration: <strong style="color: #a371f7;">${durationText}</strong></span>`;
                    } else if (issue.started_at) {
                        metaHtml += `<span><i class="ph ph-play-circle" style="color: #3fb950;"></i> Started: ${startedText}</span>`;
                    } else if (issue.assigned_at) {
                        metaHtml += `<span><i class="ph ph-clock text-primary"></i> Assigned: ${assignedText}</span>`;
                    } else {
                        metaHtml += `<span><i class="ph ph-calendar-blank text-secondary"></i> Created: ${createdText}</span>`;
                    }
                    metaHtml += `</div>`;

                    card.innerHTML = `
                        <div class="issue-header">
                            <div class="issue-title-area" style="display: flex; flex-direction: column; gap: 0.4rem;">
                                <a href="/repositories/?id=${issue.repo_id}" class="issue-repo" style="font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.5px; display: inline-flex; align-items: center; gap: 0.25rem;">
                                    <i class="ph ph-git-repository"></i> ${issue.repo_name}
                                </a>
                                <h3 style="margin: 0; font-size: 1.25rem;">
                                    <a href="${issueLink}" target="_blank">#${issueNumber} - ${issue.title}</a>
                                    <i class="ph ph-arrow-square-out" style="font-size: 0.85rem; color: var(--text-secondary);"></i>
                                </h3>
                            </div>
                            <span class="badge badge-${issue.status === 'closed' ? 'secondary' : (issue.status === 'approved' ? 'success' : 'warning')}" style="padding: 0.4rem 0.8rem; font-size: 0.75rem; border-radius: 20px;">${issue.status.toUpperCase()}</span>
                        </div>
                        <p class="text-secondary" style="font-size: 0.95rem; margin-top: 0.75rem; margin-bottom: 0.5rem; line-height: 1.5;">${issue.body ? (issue.body.length > 150 ? issue.body.substring(0, 150) + '...' : issue.body) : 'No description provided.'}</p>
                        ${labelHtml}
                        ${metaHtml}
                    `;
                    issuesListContainer.appendChild(card);
                });
            };

            typeFilter.addEventListener('change', (e) => {
                activeTab = e.target.value;
                currentPage = 1;
                loadIssues();
            });

            searchInput.addEventListener('input', renderIssues);
            labelFilter.addEventListener('change', renderIssues);

            let currentPage = 1;
            let currentLimit = 10;

            const loadIssues = async () => {
                try {
                    const urlParams = new URLSearchParams(window.location.search);
                    const queryUserId = urlParams.get('user_id') || 'me';
                    
                    const res = await API.fetchUserIssues(queryUserId, currentPage, currentLimit, activeTab);
                    allIssues = res.data.issues || [];
                    allLabels = res.data.labels || [];

                    // Populate label filter
                    labelFilter.innerHTML = '<option value="">All Labels</option>';
                    allLabels.sort().forEach(lbl => {
                        const opt = document.createElement('option');
                        opt.value = lbl;
                        opt.textContent = lbl;
                        labelFilter.appendChild(opt);
                    });

                    if (queryUserId !== 'me') {
                        document.getElementById('issues-page-title').textContent = "User's Issues";
                    } else {
                        document.getElementById('issues-page-title').textContent = "My Issues";
                    }

                    renderIssues();
                    
                    Components.renderPagination('issues-pagination', res.meta, (p) => {
                        currentPage = p;
                        loadIssues();
                    }, (l) => {
                        currentLimit = l;
                        currentPage = 1;
                        loadIssues();
                    });
                } catch (e) {
                    console.error("Failed to load issues", e);
                    issuesListContainer.innerHTML = `
                        <div class="text-center py-4 text-secondary" style="grid-column: 1 / -1; display: flex; flex-direction: column; align-items: center;">
                            <i class="ph ph-warning-circle" style="font-size: 2.5rem; color: var(--danger-color);"></i>
                            <p class="mt-1">Failed to fetch issues from server: ${e.message}</p>
                        </div>
                    `;
                }
            };

            const checkStatusAndRender = (status) => {
                const user = API.getCurrentUser();
                if (user && (user.is_admin || user.is_super_admin)) {
                    return false;
                }
                if (status === 'PASSIVE') {
                    const mainContent = document.querySelector('.main-content');
                    if (mainContent) {
                        mainContent.innerHTML = `
                            <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; flex-grow: 1; min-height: 60vh; text-align: center; padding: 2rem;">
                                <i class="ph ph-hourglass-high" style="font-size: 4rem; color: var(--warning-color); animation: pulse 2s infinite; margin-bottom: 1.5rem;"></i>
                                <h2 style="font-size: 2rem; font-weight: 700; color: white; margin-bottom: 1rem;">Event has not started yet.</h2>
                                <p class="text-secondary" style="max-width: 450px; font-size: 1.1rem; line-height: 1.6; margin: 0;">Interaction is disabled until the event starts. Please check back later!</p>
                            </div>
                        `;
                    }
                    return true;
                }
                return false;
            };

            const checkEventStatus = async () => {
                try {
                    const data = await API.request('/event/status');
                    const status = data.status || 'PASSIVE';
                    sessionStorage.setItem("event_status", status);
                    return checkStatusAndRender(status);
                } catch (e) {
                    console.error("Failed to load event status:", e);
                    return checkStatusAndRender('PASSIVE');
                }
            };

            const isPassive = await checkEventStatus();
            if (isPassive) {
                window.addEventListener('eventStatusLoaded', (e) => {
                    if (e.detail === 'ACTIVE') {
                        window.location.reload();
                    }
                });
                return;
            }

            window.addEventListener('eventStatusLoaded', (e) => {
                if (e.detail === 'PASSIVE') {
                    checkStatusAndRender('PASSIVE');
                }
            });

            await loadIssues();
        });
    </script>
