<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rules & Scoring | Commit Overflow</title>
    <meta name="description" content="Read the rules and scoring system for Commit Overflow. Learn how to earn points and climb the leaderboard, a collaboration between FOSS CEAL and FOSS Club LBSITW">
    <link rel="canonical" href="https://commitoverflow.ceal.in/rules/" />
    <link rel="icon" type="image/png" href="/favicon-96x96.png?v=20260702" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=20260702" />
    <link rel="shortcut icon" href="/favicon.ico?v=20260702" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=20260702" />
    <meta name="apple-mobile-web-app-title" content="C-O" />
    <link rel="manifest" href="/site.webmanifest?v=20260702" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Commit Overflow" />
	<meta property="og:url" content="https://commitoverflow.ceal.in/rules/" />
    <meta property="og:title" content="Rules & Scoring | Commit Overflow" />
    <meta property="og:description" content="Read the rules and scoring system for Commit Overflow. Learn how to earn points and climb the leaderboard, a collaboration between FOSS CEAL and FOSS Club LBSITW" />
    <meta property="og:image" content="https://commitoverflow.ceal.in/logo/logo-dark-clr.svg" />
    <meta property="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web" defer></script>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/components.css">
    <style>
        /* Accordion styling */
        .accordion {
            background-color: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            margin-bottom: 1rem;
            overflow: hidden;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .accordion:hover {
            border-color: var(--accent-primary);
            box-shadow: 0 10px 30px -10px rgba(35, 134, 54, 0.2);
            transform: translateY(-2px);
        }
        .accordion-header {
            padding: 1.25rem 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            font-weight: 600;
            font-size: 1.1rem;
        }
        .accordion-header:hover {
            background-color: var(--bg-tertiary);
        }
        .accordion-content {
            padding: 0 1.5rem;
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease, padding 0.3s ease;
            color: var(--text-secondary);
            line-height: 1.5;
        }
        .accordion.open .accordion-content {
            padding: 0 1.5rem 1.5rem;
            max-height: 800px;
            margin-top: 0.5rem;
        }
        .accordion.open .ph-caret-down {
            transform: rotate(180deg);
        }
        .ph-caret-down {
            transition: transform 0.3s ease;
        }
    </style>
</head>
<body>
<script>if(localStorage.getItem('sidebar-collapsed')==='true') document.body.classList.add('sidebar-collapsed');</script>
    
    <div class="app-wrapper">
        <!-- Sidebar injected here -->
        
        <main class="main-content">
            <div class="page-header">
                <h1>Rules & Scoring System</h1>
                <p class="text-secondary mt-1">Everything you need to know about how points are awarded.</p>
            </div>

            <div class="grid grid-cols-2 md:grid-cols-1 gap-4">
                
                <div>
                    <h2 class="mb-3">How to Earn Points</h2>
                    <div id="scoring-rules-list">
                        <div class="accordion w-full" style="padding: 1.25rem 1.5rem;">
                            <div class="skeleton skeleton-text" style="height: 1.5rem; width: 60%; border-radius: 4px;"></div>
                        </div>
                        <div class="accordion w-full" style="padding: 1.25rem 1.5rem;">
                            <div class="skeleton skeleton-text" style="height: 1.5rem; width: 50%; border-radius: 4px;"></div>
                        </div>
                        <div class="accordion w-full" style="padding: 1.25rem 1.5rem;">
                            <div class="skeleton skeleton-text" style="height: 1.5rem; width: 70%; border-radius: 4px;"></div>
                        </div>
                    </div>
                </div>

                <div>
                    <h2 class="mb-3">Frequently Asked Questions</h2>
                    <div id="faqs-list">
                        <div class="accordion w-full" style="padding: 1.25rem 1.5rem;">
                            <div class="skeleton skeleton-text" style="height: 1.5rem; width: 80%; border-radius: 4px;"></div>
                        </div>
                        <div class="accordion w-full" style="padding: 1.25rem 1.5rem;">
                            <div class="skeleton skeleton-text" style="height: 1.5rem; width: 65%; border-radius: 4px;"></div>
                        </div>
                    </div>
                </div>

            </div>
        </main>
    </div>

    <script src="/js/api.js"></script>
    <script src="/js/components.js"></script>
    <script src="/js/notifications.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            if (!API.isAuthenticated()) {
                window.location.href = '/login/';
                return;
            }

            Components.renderSidebar('rules');
            
            try {
                const rules = await API.fetchRules();
                const scoringContainer = document.getElementById('scoring-rules-list');
                const faqContainer = document.getElementById('faqs-list');
                
                if (scoringContainer && faqContainer) {
                    scoringContainer.innerHTML = '';
                    faqContainer.innerHTML = '';
                    
                    rules.forEach(item => {
                        if (item.category === 'scoring') {
                            const div = document.createElement('div');
                            div.className = 'accordion';
                            const sign = item.points >= 0 ? '+' : '';
                            div.innerHTML = `
                                <div class="accordion-header">
                                    <div style="display: flex; align-items: center; gap: 0.75rem;">
                                        <i class="ph ph-star text-warning"></i>
                                        <span>${item.title}</span>
                                        <span class="badge ${item.points >= 0 ? 'badge-success' : 'badge-danger'}" style="font-size: 0.75rem; padding: 0.25rem 0.5rem; border-radius: 12px;">${sign}${item.points} pts</span>
                                    </div>
                                    <i class="ph ph-caret-down text-secondary"></i>
                                </div>
                                <div class="accordion-content">
                                    <p>${item.body}</p>
                                </div>
                            `;
                            scoringContainer.appendChild(div);
                        } else if (item.category === 'faq') {
                            const div = document.createElement('div');
                            div.className = 'accordion';
                            div.innerHTML = `
                                <div class="accordion-header">
                                    <div style="display: flex; align-items: center; gap: 0.75rem;">
                                        <i class="ph ph-question text-primary"></i>
                                        <span>${item.title}</span>
                                    </div>
                                    <i class="ph ph-caret-down text-secondary"></i>
                                </div>
                                <div class="accordion-content">
                                    <p>${item.body}</p>
                                </div>
                            `;
                            faqContainer.appendChild(div);
                        }
                    });
                    
                    // Wire accordions
                    Components.setupAccordions();
                }
            } catch (err) {
                console.error("Failed to load rules", err);
                Components.showToast("Failed to load rules & scoring information.", "error");
            }
        });
    </script>
</body>
</html>
