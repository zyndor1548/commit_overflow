    <style>
        .repo-card {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            background: var(--bg-secondary);
            padding: 1.5rem;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            height: 100%;
        }
        .repo-card:hover {
            transform: translateY(-4px);
            border-color: var(--accent-primary);
            box-shadow: 0 10px 30px -10px rgba(35, 134, 54, 0.2);
        }
        .repo-title {
            font-size: 1.25rem;
            font-weight: 600;
            color: white;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .repo-meta {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 0.75rem;
            margin: 1.5rem 0;
            font-size: 0.875rem;
            color: var(--text-secondary);
        }
        .repo-meta div {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            background: var(--bg-tertiary);
            padding: 0.5rem 0.75rem;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            transition: background-color 0.2s;
        }
        .repo-meta div:hover {
            background: var(--bg-secondary);
            color: var(--text-primary);
        }
        .difficulty-bar {
            display: flex;
            height: 6px;
            border-radius: 3px;
            overflow: hidden;
            margin-top: 0.75rem;
            background-color: var(--bg-tertiary);
        }
        .diff-segment {
            height: 100%;
        }
        .diff-segment.easy { background-color: #3fb950; }
        .diff-segment.medium { background-color: #d29922; }
        .diff-segment.hard { background-color: #f85149; }
        .repo-details-modal {
            max-width: 700px;
        }
        .detail-section {
            margin-top: 1.5rem;
        }
        .detail-list {
            max-height: 250px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            margin-top: 0.5rem;
            padding-right: 0.5rem;
        }
        .detail-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.75rem;
            background-color: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 0.875rem;
        }
    </style>
</head>

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            if (!API.isAuthenticated()) {
                window.location.href = '/login/';
                return;
            }

            Components.renderSidebar('repositories');
            Components.setupModal('repo-modal', null, 'modal-close');

            const reposContainer = document.getElementById('repos-container');
            const repoModal = document.getElementById('repo-modal');

            const showRepoDetail = async (repoId) => {
                try {
                    const detail = await API.fetchRepoDetail(repoId);
                    const repo = detail.repository;
                    
                    document.getElementById('modal-repo-name').textContent = repo.name;
                    
                    const linksContainer = document.getElementById('modal-repo-links-container');
                    linksContainer.innerHTML = '';
                    
                    if (repo.github_url) {
                        linksContainer.innerHTML += `
                            <div style="display: flex; gap: 1rem; align-items: center;">
                                <input type="text" class="form-control" value="${repo.github_url}" readonly>
                                <a href="${repo.github_url}" class="btn btn-primary" target="_blank" style="width: auto; white-space: nowrap;"><i class="ph ph-github-logo"></i> Visit GitHub</a>
                            </div>
                        `;
                    }
                    if (repo.gitlab_url) {
                        linksContainer.innerHTML += `
                            <div style="display: flex; gap: 1rem; align-items: center;">
                                <input type="text" class="form-control" value="${repo.gitlab_url}" readonly>
                                <a href="${repo.gitlab_url}" class="btn btn-primary" target="_blank" style="width: auto; white-space: nowrap;"><i class="ph ph-gitlab-logo-simple"></i> Visit GitLab</a>
                            </div>
                        `;
                    }
                    
                    // Render Issues
                    const issuesList = document.getElementById('modal-issues-list');
                    issuesList.innerHTML = '';
                    if (detail.issues && detail.issues.length > 0) {
                        detail.issues.forEach(i => {
                            let badgeClass = 'badge-info';
                            if (i.status === 'approved') badgeClass = 'badge-success';
                            else if (i.status === 'assigned') badgeClass = 'badge-warning';
                            else if (i.status === 'closed') badgeClass = 'badge-secondary';

                            let diffBadge = '';
                            if (i.difficulty) {
                                let diffClass = 'badge-info';
                                if (i.difficulty === 'easy') diffClass = 'badge-success';
                                else if (i.difficulty === 'hard') diffClass = 'badge-danger';
                                diffBadge = `<span class="badge ${diffClass}" style="margin-right: 0.5rem;">${i.difficulty.toUpperCase()}</span>`;
                            }

                            const item = document.createElement('div');
                            item.className = 'detail-item';
                            item.innerHTML = `
                                <div>
                                    <strong>#${i.issue_iid || i.github_issue_id}</strong> — ${i.title}
                                </div>
                                <div style="display: flex; align-items: center;">
                                    ${diffBadge}
                                    <span class="badge ${badgeClass}">${i.status.toUpperCase()}</span>
                                </div>
                            `;
                            issuesList.appendChild(item);
                        });
                    } else {
                        issuesList.innerHTML = '<div class="text-secondary text-center py-3 text-sm">No issues tracked for this repository.</div>';
                    }

                    // Render PRs
                    const prsList = document.getElementById('modal-prs-list');
                    prsList.innerHTML = '';
                    if (detail.pull_requests && detail.pull_requests.length > 0) {
                        detail.pull_requests.forEach(pr => {
                            let badgeClass = 'badge-info';
                            if (pr.status === 'merged') badgeClass = 'badge-success';
                            else if (pr.status === 'closed_unmerged') badgeClass = 'badge-danger';

                            const item = document.createElement('div');
                            item.className = 'detail-item';
                            item.innerHTML = `
                                <div>
                                    <strong>PR #${pr.github_pr_id}</strong> by @${pr.github_username || pr.user_id}
                                </div>
                                <span class="badge ${badgeClass}">${pr.status.toUpperCase()}</span>
                            `;
                            prsList.appendChild(item);
                        });
                    } else {
                        prsList.innerHTML = '<div class="text-secondary text-center py-3 text-sm">No pull requests submitted yet.</div>';
                    }
                    
                    repoModal.classList.add('active');
                } catch(e) {
                    console.error(e);
                    Components.showToast("Failed to fetch repository details.", "error");
                }
            };

            let allRepos = [];
            const reposSearchInput = document.getElementById('repos-search');
            const filterLanguage = document.getElementById('filter-language');
            const filterPlatform = document.getElementById('filter-platform');
            const sortRepo = document.getElementById('sort-repo');
            const sortRepoDir = document.getElementById('sort-repo-dir');
            const sortRepoIcon = document.getElementById('sort-repo-icon');
            let currentSortDir = 'desc'; // Default to descending for most metrics

            if (sortRepoDir) {
                sortRepoDir.addEventListener('click', () => {
                    currentSortDir = currentSortDir === 'desc' ? 'asc' : 'desc';
                    sortRepoIcon.className = currentSortDir === 'desc' ? 'ph ph-sort-descending' : 'ph ph-sort-ascending';
                    renderRepos();
                });
            }

            // Auto-set direction when changing sort field
            if (sortRepo) {
                sortRepo.addEventListener('change', () => {
                    if (sortRepo.value === 'name') {
                        currentSortDir = 'asc';
                    } else {
                        currentSortDir = 'desc';
                    }
                    sortRepoIcon.className = currentSortDir === 'desc' ? 'ph ph-sort-descending' : 'ph ph-sort-ascending';
                    renderRepos();
                });
            }

            const renderRepos = () => {
                if (!reposContainer) return;
                reposContainer.innerHTML = '';
                
                const query = reposSearchInput.value.toLowerCase().trim();
                const selectedLanguage = filterLanguage.value;
                const selectedPlatform = filterPlatform.value;
                const sortBy = sortRepo.value;

                let filteredRepos = allRepos.filter(repo => {
                    const matchName = repo.name && repo.name.toLowerCase().includes(query);
                    const matchTechQuery = repo.tech_stack && repo.tech_stack.some(t => t.toLowerCase().includes(query));
                    const matchQuery = matchName || matchTechQuery;

                    let matchLang = true;
                    if (selectedLanguage) {
                        matchLang = repo.tech_stack && repo.tech_stack.includes(selectedLanguage);
                    }
                    
                    let matchPlatform = true;
                    if (selectedPlatform) {
                        if (selectedPlatform === 'github') matchPlatform = !!repo.github_url;
                        if (selectedPlatform === 'gitlab') matchPlatform = !!repo.gitlab_url;
                    }

                    return matchQuery && matchLang && matchPlatform;
                });

                // Apply Sorting
                filteredRepos.sort((a, b) => {
                    const dirMultiplier = currentSortDir === 'asc' ? 1 : -1;
                    
                    switch (sortBy) {
                        case 'name':
                            return (a.name || '').localeCompare(b.name || '') * dirMultiplier;
                        case 'contributors':
                            return ((a.contributor_count || 0) - (b.contributor_count || 0)) * dirMultiplier;
                        case 'open_issues':
                            return ((a.open_issues || 0) - (b.open_issues || 0)) * dirMultiplier;
                        case 'open_prs':
                            return ((a.open_prs || 0) - (b.open_prs || 0)) * dirMultiplier;
                        case 'merged_prs':
                            return ((a.merged_prs || 0) - (b.merged_prs || 0)) * dirMultiplier;
                        default:
                            return 0;
                    }
                });

                if (filteredRepos.length === 0) {
                    reposContainer.innerHTML = `
                        <div class="text-center py-5 text-secondary col-span-2" style="grid-column: 1 / -1; display: flex; flex-direction: column; align-items: center;">
                            <i class="ph ph-books" style="font-size: 2.5rem;"></i>
                            <p class="mt-1">No matching repositories found.</p>
                        </div>
                    `;
                    return;
                }

                filteredRepos.forEach(repo => {
                    const card = document.createElement('div');
                    card.className = 'card repo-card glass-card';
                    
                    // Tech stack badges
                    let techBadges = '';
                    if (repo.tech_stack && repo.tech_stack.length > 0) {
                        repo.tech_stack.forEach(tech => {
                            techBadges += `<span class="badge badge-info text-xs">${tech}</span> `;
                        });
                    }
                    
                    // Difficulty bar percentages
                    const diff = repo.difficulty_distribution || { easy: 0, medium: 0, hard: 0 };
                    const totalIssues = diff.easy + diff.medium + diff.hard;
                    let easyPct = 0, medPct = 0, hardPct = 0;
                    if (totalIssues > 0) {
                        easyPct = (diff.easy / totalIssues) * 100;
                        medPct = (diff.medium / totalIssues) * 100;
                        hardPct = (diff.hard / totalIssues) * 100;
                    }

                    let platformIcon = '<i class="ph ph-git-fork text-primary"></i>';
                    if (repo.github_url && repo.gitlab_url) {
                        platformIcon = '<i class="ph ph-github-logo text-primary" style="margin-right: 4px;"></i><i class="ph ph-gitlab-logo-simple text-primary"></i>';
                    } else if (repo.github_url) {
                        platformIcon = '<i class="ph ph-github-logo text-primary"></i>';
                    } else if (repo.gitlab_url) {
                        platformIcon = '<i class="ph ph-gitlab-logo-simple text-primary"></i>';
                    }

                    card.innerHTML = `
                        <div class="repo-title">
                            <span>${repo.name}</span>
                            <div>${platformIcon}</div>
                        </div>
                        <div style="margin-top: 0.5rem; display: flex; flex-wrap: wrap; gap: 0.25rem;">
                            ${techBadges}
                        </div>
                        <div class="repo-meta">
                            <div><i class="ph ph-users-three text-primary"></i> <span>Contributors: <strong class="text-primary">${repo.contributor_count}</strong></span></div>
                            <div><i class="ph ph-warning-circle text-primary"></i> <span>Open Issues: <strong style="color: #d29922;">${repo.open_issues}</strong></span></div>
                            <div><i class="ph ph-git-pull-request text-primary"></i> <span>Open PRs: <strong style="color: #a371f7;">${repo.open_prs}</strong></span></div>
                            <div><i class="ph ph-git-merge text-primary"></i> <span>Merged PRs: <strong style="color: #3fb950;">${repo.merged_prs}</strong></span></div>
                        </div>
                        <div>
                            <span class="text-secondary text-xs">Issue Difficulty Spread</span>
                            <div class="difficulty-bar">
                                <div class="diff-segment easy" style="width: ${totalIssues > 0 ? easyPct : 33.3}%"></div>
                                <div class="diff-segment medium" style="width: ${totalIssues > 0 ? medPct : 33.3}%"></div>
                                <div class="diff-segment hard" style="width: ${totalIssues > 0 ? hardPct : 33.4}%"></div>
                            </div>
                            <div style="display: flex; justify-content: space-between; font-size: 0.75rem; color: var(--text-secondary); margin-top: 0.25rem;">
                                <span>Easy: ${diff.easy}</span>
                                <span>Medium: ${diff.medium}</span>
                                <span>Hard: ${diff.hard}</span>
                            </div>
                        </div>
                    `;
                    
                    card.addEventListener('click', () => showRepoDetail(repo.id));
                    reposContainer.appendChild(card);
                });
            };

            let currentPage = 1;
            let currentLimit = 10;

            const loadRepos = async () => {
                try {
                    const res = await API.fetchRepos(currentPage, currentLimit);
                    allRepos = res.data;
                    
                    // Populate language filter
                    const languageSet = new Set();
                    allRepos.forEach(repo => {
                        if (repo.tech_stack) {
                            repo.tech_stack.forEach(tech => languageSet.add(tech));
                        }
                    });

                    filterLanguage.innerHTML = '<option value="">All Languages</option>';
                    Array.from(languageSet).sort().forEach(tech => {
                        const opt = document.createElement('option');
                        opt.value = tech;
                        opt.textContent = tech;
                        filterLanguage.appendChild(opt);
                    });

                    renderRepos();
                    
                    Components.renderPagination('repos-pagination', res.meta, (p) => {
                        currentPage = p;
                        loadRepos();
                    }, (l) => {
                        currentLimit = l;
                        currentPage = 1;
                        loadRepos();
                    });
                } catch(e) {
                    console.error(e);
                    reposContainer.innerHTML = '<div class="text-secondary text-center py-5 col-span-2" style="grid-column: 1 / -1;">Failed to load repositories. Please try again later.</div>';
                }
            };

            if (reposSearchInput) {
                reposSearchInput.addEventListener('input', renderRepos);
            }
            if (filterLanguage) {
                filterLanguage.addEventListener('change', renderRepos);
            }
            if (filterPlatform) {
                filterPlatform.addEventListener('change', renderRepos);
            }

            const checkStatusAndRender = (status) => {
                const user = API.getCurrentUser();
                if (user && (user.is_admin || user.is_super_admin)) {
                    return false;
                }
                if (status === 'PASSIVE') {
                    const mainContent = document.querySelector('.main-content');
                    if (mainContent) {
                        mainContent.innerHTML = `
                            <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; flex-grow: 1; min-height: 60vh; text-align: center; padding: 2rem;">
                                <i class="ph ph-hourglass-high" style="font-size: 4rem; color: var(--warning-color); animation: pulse 2s infinite; margin-bottom: 1.5rem;"></i>
                                <h2 style="font-size: 2rem; font-weight: 700; color: white; margin-bottom: 1rem;">Event has not started yet.</h2>
                                <p class="text-secondary" style="max-width: 450px; font-size: 1.1rem; line-height: 1.6; margin: 0;">Interaction is disabled until the event starts. Please check back later!</p>
                            </div>
                        `;
                    }
                    return true;
                }
                return false;
            };

            const checkEventStatus = async () => {
                try {
                    const data = await API.request('/event/status');
                    const status = data.status || 'PASSIVE';
                    sessionStorage.setItem("event_status", status);
                    return checkStatusAndRender(status);
                } catch (e) {
                    console.error("Failed to load event status:", e);
                    return checkStatusAndRender('PASSIVE');
                }
            };

            const isPassive = await checkEventStatus();
            if (isPassive) {
                window.addEventListener('eventStatusLoaded', (e) => {
                    if (e.detail === 'ACTIVE') {
                        window.location.reload();
                    }
                });
                return;
            }

            window.addEventListener('eventStatusLoaded', (e) => {
                if (e.detail === 'PASSIVE') {
                    checkStatusAndRender('PASSIVE');
                }
            });

            await loadRepos();
        });
    </script>
</body>
</html>
