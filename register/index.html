<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | Commit Overflow</title>
    <meta name="description" content="Register for Commit Overflow and join the ultimate 1 Week + 1 Month open source challenge. Connect your GitHub/GitLab account and start contributing, a collaboration between FOSS CEAL and FOSS Club LBSITW">
    <link rel="canonical" href="https://commitoverflow.ceal.in/register/" />
    <link rel="icon" type="image/png" href="/favicon-96x96.png?v=20260702" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=20260702" />
    <link rel="shortcut icon" href="/favicon.ico?v=20260702" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=20260702" />
    <meta name="apple-mobile-web-app-title" content="C-O" />
    <link rel="manifest" href="/site.webmanifest?v=20260702" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Commit Overflow" />
	<meta property="og:url" content="https://commitoverflow.ceal.in/register/" />
    <meta property="og:title" content="Register | Commit Overflow" />
    <meta property="og:description" content="Register for Commit Overflow and join the ultimate 1 Week + 1 Month open source challenge. Connect your GitHub/GitLab account and start contributing, a collaboration between FOSS CEAL and FOSS Club LBSITW" />
    <meta property="og:image" content="https://commitoverflow.ceal.in/logo/logo-dark-clr.svg" />
    <meta property="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preload" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" as="style">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web" defer></script>
    <link rel="preload" href="/css/style.css" as="style">
    <link rel="preload" href="/css/components.css" as="style">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/components.css">
    <style>
        .auth-container {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 2rem 1rem;
        }
        .auth-card {
            width: 100%;
            max-width: 500px;
        }
        .auth-logo {
            text-align: center;
            margin-bottom: 1.5rem;
            font-size: 2rem;
            color: white;
            font-weight: bold;
        }

        /* College autocomplete */
        .college-autocomplete-wrapper {
            position: relative;
        }
        .college-dropdown {
            position: absolute;
            top: calc(100% + 4px);
            left: 0;
            right: 0;
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            max-height: 220px;
            overflow-y: auto;
            z-index: 100;
            box-shadow: 0 8px 24px rgba(0,0,0,0.35);
            display: none;
        }
        .college-dropdown.open {
            display: block;
        }
        .college-option {
            padding: 0.6rem 0.9rem;
            cursor: pointer;
            font-size: 0.9rem;
            color: var(--text-primary);
            transition: background 0.15s;
        }
        .college-option:hover,
        .college-option.active {
            background: var(--bg-tertiary, rgba(255,255,255,0.06));
            color: var(--accent-primary);
        }
        .college-option.new-entry {
            color: var(--text-secondary);
            border-top: 1px solid var(--border-color);
            font-style: italic;
        }
        .college-option.new-entry i {
            margin-right: 0.4rem;
        }
        .college-dropdown::-webkit-scrollbar { width: 4px; }
        .college-dropdown::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 4px; }
    </style>
</head>
<body>
<script>if(localStorage.getItem('sidebar-collapsed')==='true') document.body.classList.add('sidebar-collapsed');</script>

    <div class="auth-container">
        <div class="card auth-card glass-card">
            <div class="auth-logo">
                <img src="/logo/logo-light-clr.svg" alt="Logo" width="48" height="48" style="height: 48px; width: auto; margin-bottom: 0.5rem;"><br>
                Commit Overflow
            </div>
            <h2 class="text-center mb-3">Create Account</h2>
            
            <form id="register-form">
                <div class="form-group mb-2">
                    <label class="form-label">Display Name <span class="text-error">*</span></label>
                    <input type="text" id="display-name" class="form-control" placeholder="John Doe" required>
                </div>

                <div class="grid grid-cols-2 md:grid-cols-1 gap-2 mb-2">
                    <div class="form-group">
                        <label class="form-label">GitHub Username</label>
                        <input type="text" id="github-user" class="form-control" placeholder="octocat">
                    </div>
                    <div class="form-group">
                        <label class="form-label">GitLab Username</label>
                        <input type="text" id="gitlab-user" class="form-control" placeholder="gitlab-user">
                    </div>
                </div>
                <div class="text-sm text-secondary mb-3 mt-n1">At least one username (GitHub or GitLab) is required.</div>

                <!-- College autocomplete -->
                <div class="form-group college-autocomplete-wrapper">
                    <label class="form-label">College Name</label>
                    <input
                        type="text"
                        id="college"
                        class="form-control"
                        placeholder="Start typing your college…"
                        autocomplete="off"
                        aria-autocomplete="list"
                        aria-controls="college-dropdown"
                        aria-expanded="false"
                    >
                    <div id="college-dropdown" class="college-dropdown" role="listbox"></div>
                </div>

                <div class="form-group mb-3">
                    <label class="form-label">Password</label>
                    <input type="password" id="password" class="form-control" placeholder="Min. 6 characters" required minlength="6">
                </div>
                
                <button type="submit" class="btn btn-primary btn-block mb-2" id="register-btn">
                    Register
                </button>
                
                <div class="text-center mt-2">
                    <span class="text-secondary">Already have an account?</span> 
                    <a href="/login/">Back to Login</a>
                </div>
            </form>
        </div>
    </div>

    <script src="/js/api.js"></script>
    <script src="/js/components.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {

            // ── College autocomplete ─────────────────────────────────────────
            const collegeInput   = document.getElementById('college');
            const collegeDropdown = document.getElementById('college-dropdown');
            let allColleges = [];
            let activeIdx   = -1;

            // Fetch existing college names from the backend.
            try {
                const baseUrl = await API.getBaseUrl();
                const res = await fetch(`${baseUrl}/colleges`);
                if (res.ok) allColleges = await res.json();
            } catch (e) {
                console.warn('Could not fetch colleges:', e);
            }

            function renderDropdown(query) {
                const q = query.trim().toLowerCase();
                collegeDropdown.innerHTML = '';
                activeIdx = -1;

                const matched = q
                    ? allColleges.filter(c => c.toLowerCase().includes(q))
                    : allColleges.slice(0, 12);  // show first 12 when field focused with no input

                matched.forEach((name, i) => {
                    const opt = document.createElement('div');
                    opt.className = 'college-option';
                    opt.setAttribute('role', 'option');
                    opt.textContent = name;
                    opt.addEventListener('mousedown', (e) => {
                        e.preventDefault();
                        collegeInput.value = name;
                        closeDropdown();
                    });
                    collegeDropdown.appendChild(opt);
                });

                // "Add new" option if typed text is not an exact match (case-insensitive).
                const exactMatch = allColleges.some(c => c.toLowerCase() === q);
                if (q && !exactMatch) {
                    const addOpt = document.createElement('div');
                    addOpt.className = 'college-option new-entry';
                    addOpt.setAttribute('role', 'option');
                    addOpt.innerHTML = `<i class="ph ph-plus-circle"></i>Use "<strong>${query.trim()}</strong>"`;
                    addOpt.addEventListener('mousedown', (e) => {
                        e.preventDefault();
                        collegeInput.value = query.trim();
                        closeDropdown();
                    });
                    collegeDropdown.appendChild(addOpt);
                }

                const hasItems = collegeDropdown.children.length > 0;
                collegeDropdown.classList.toggle('open', hasItems);
                collegeInput.setAttribute('aria-expanded', String(hasItems));
            }

            function closeDropdown() {
                collegeDropdown.classList.remove('open');
                collegeInput.setAttribute('aria-expanded', 'false');
                activeIdx = -1;
            }

            function setActive(idx) {
                const items = collegeDropdown.querySelectorAll('.college-option');
                items.forEach((el, i) => el.classList.toggle('active', i === idx));
                if (items[idx]) items[idx].scrollIntoView({ block: 'nearest' });
                activeIdx = idx;
            }

            collegeInput.addEventListener('focus', () => renderDropdown(collegeInput.value));
            collegeInput.addEventListener('input', () => renderDropdown(collegeInput.value));

            collegeInput.addEventListener('keydown', (e) => {
                const items = Array.from(collegeDropdown.querySelectorAll('.college-option'));
                if (!items.length) return;
                if (e.key === 'ArrowDown') {
                    e.preventDefault();
                    setActive(Math.min(activeIdx + 1, items.length - 1));
                } else if (e.key === 'ArrowUp') {
                    e.preventDefault();
                    setActive(Math.max(activeIdx - 1, 0));
                } else if (e.key === 'Enter' && activeIdx >= 0) {
                    e.preventDefault();
                    collegeInput.value = items[activeIdx].textContent.replace(/^[^\S\r\n]*\+[^\S\r\n]*Use "/, '').replace(/"$/, '');
                    // For new-entry items, extract just the text the user typed.
                    if (items[activeIdx].classList.contains('new-entry')) {
                        collegeInput.value = collegeInput.value; // already set above via trim; just close
                    }
                    closeDropdown();
                } else if (e.key === 'Escape') {
                    closeDropdown();
                }
            });

            document.addEventListener('click', (e) => {
                if (!collegeInput.contains(e.target) && !collegeDropdown.contains(e.target)) {
                    closeDropdown();
                }
            });

            // ── Registration form submit ─────────────────────────────────────
            const form = document.getElementById('register-form');
            if (form) {
                form.addEventListener('submit', async (e) => {
                    e.preventDefault();
                    const name        = document.getElementById('display-name').value.trim();
                    // Lowercase usernames on the client side too — belt-and-suspenders.
                    const githubUser  = document.getElementById('github-user').value.trim().toLowerCase();
                    const gitlabUser  = document.getElementById('gitlab-user').value.trim().toLowerCase();
                    const college     = collegeInput.value.trim();
                    const password    = document.getElementById('password').value;
                    const registerBtn = document.getElementById('register-btn');
                    
                    if (!githubUser && !gitlabUser) {
                        Components.showToast("Please provide at least a GitHub or GitLab username.", "error");
                        return;
                    }

                    registerBtn.disabled = true;
                    registerBtn.textContent = "Registering...";
                    
                    try {
                        await API.register(name, githubUser, gitlabUser, password, college);
                        Components.showToast("Registration successful!", "success");
                        setTimeout(() => {
                            window.location.href = '/onboarding/';
                        }, 1000);
                    } catch (err) {
                        Components.showToast(err.message || "Registration failed.", "error");
                        registerBtn.disabled = false;
                        registerBtn.textContent = "Register";
                    }
                });
            }
        });
    </script>
</body>
</html>
