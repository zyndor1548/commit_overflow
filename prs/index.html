    <style>
        .prs-controls {
            display: flex;
            gap: 1rem;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
        }
        .pr-card {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            background: var(--bg-secondary);
            padding: 1.5rem;
            margin-bottom: 1rem;
        }
        .pr-card:hover {
            transform: translateY(-4px);
            border-color: var(--accent-primary);
            box-shadow: 0 10px 30px -10px rgba(35, 134, 54, 0.2);
        }

        .pr-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 1rem;
            margin-bottom: 0.5rem;
        }
        .pr-title-area h3 {
            font-size: 1.15rem;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }
        .pr-title-area h3 a {
            color: var(--text-primary);
        }
        .pr-title-area h3 a:hover {
            color: var(--accent-primary-hover);
            text-decoration: underline;
        }
        .pr-repo {
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--accent-secondary);
        }
        .pr-repo:hover {
            text-decoration: underline;
        }
        .pr-meta-info {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 1.25rem;
            font-size: 0.85rem;
            color: var(--text-secondary);
            margin-top: 1rem;
            padding-top: 1rem;
            border-top: 1px solid var(--border-color);
        }
        .pr-meta-info > span {
            display: flex;
            align-items: center;
            gap: 0.35rem;
        }
    </style>
</head>

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            if (!API.isAuthenticated()) {
                window.location.href = '/login/';
                return;
            }

            Components.renderSidebar('prs');

            let allPRs = [];
            let activeTab = 'pending'; // 'pending', 'merged'
            const user = API.getCurrentUser();

            const searchInput = document.getElementById('prs-search');
            const repoFilter = document.getElementById('filter-repo');
            const statusFilter = document.getElementById('filter-status');
            const prsListContainer = document.getElementById('prs-list');

            const renderPRs = () => {
                const searchQuery = searchInput.value.toLowerCase().trim();
                const selectedRepo = repoFilter.value;

                let filtered = allPRs.filter(pr => {
                    if (activeTab === 'pending') {
                        return pr.status === 'under_review' || pr.status === 'approved' || pr.status === 'needs_changes' || pr.status === 'invalid_assignment';
                    } else if (activeTab === 'merged') {
                        return pr.status === 'merged';
                    }
                    return false;
                });

                if (selectedRepo) {
                    filtered = filtered.filter(pr => pr.repo_name === selectedRepo);
                }

                if (searchQuery) {
                    filtered = filtered.filter(pr => 
                        pr.github_pr_id.toString().includes(searchQuery) ||
                        pr.repo_name.toLowerCase().includes(searchQuery) ||
                        (pr.title && pr.title.toLowerCase().includes(searchQuery)) ||
                        (pr.issue_title && pr.issue_title.toLowerCase().includes(searchQuery))
                    );
                }

                if (filtered.length === 0) {
                    prsListContainer.innerHTML = `
                        <div class="text-center py-4 text-secondary" style="grid-column: 1 / -1; display: flex; flex-direction: column; align-items: center;">
                            <i class="ph ph-git-pull-request" style="font-size: 2.5rem;"></i>
                            <p class="mt-1">No pull requests found.</p>
                        </div>
                    `;
                    return;
                }

                prsListContainer.innerHTML = '';
                filtered.forEach(pr => {
                    const card = document.createElement('div');
                    card.className = `card pr-card status-${pr.status}`;

                    // Format Status Label
                    let statusLabel = 'Under Review';
                    let badgeClass = 'badge-info';
                    if (pr.status === 'merged') {
                        statusLabel = 'Merged';
                        badgeClass = 'badge-success';
                    } else if (pr.status === 'closed_unmerged') {
                        statusLabel = 'Closed (Unmerged)';
                        badgeClass = 'badge-danger';
                    } else if (pr.status === 'approved') {
                        statusLabel = 'Approved';
                        badgeClass = 'badge-success';
                    } else if (pr.status === 'needs_changes') {
                        statusLabel = 'Needs Changes';
                        badgeClass = 'badge-warning';
                    } else if (pr.status === 'invalid_assignment') {
                        statusLabel = 'Invalid Assignment';
                        badgeClass = 'badge-danger';
                    }

                    // Format date
                    const dateText = pr.status === 'merged' && pr.merged_at
                        ? `Merged on ${API.formatDateTime(pr.merged_at)}`
                        : `Submitted on ${API.formatDateTime(pr.created_at)}`;

                    // PR external GitHub link
                    const prLink = `${pr.repo_url}/pull/${pr.github_pr_id}`;

                    let basePoints = 50;
                    if (pr.difficulty === 'easy') basePoints = 20;
                    else if (pr.difficulty === 'medium') basePoints = 35;
                    else if (pr.difficulty === 'hard') basePoints = 50;
                    else if (pr.difficulty === 'documentation') basePoints = 10;

                    const pointsText = pr.status === 'merged' 
                        ? `<span class="text-primary" style="font-weight: 600;">+${basePoints} Points Awarded</span>` 
                        : (pr.status === 'closed_unmerged' || pr.status === 'invalid_assignment'
                            ? '<span style="color: var(--danger-color); font-weight: 600;">0 Points</span>' 
                            : `<span style="color: var(--warning-color); font-weight: 600;">+${basePoints} Points Projected</span>`);

                    const difficultyBadge = pr.difficulty
                        ? `<span class="badge" style="background-color: ${pr.difficulty === 'easy' ? '#3fb950' : (pr.difficulty === 'medium' ? '#d29922' : (pr.difficulty === 'documentation' ? '#58a6ff' : '#f85149'))}; text-transform: capitalize; font-size: 0.75rem; padding: 0.2rem 0.5rem; margin-left: 0.5rem;">${pr.difficulty}</span>`
                        : '';

                    card.innerHTML = `
                        <div class="pr-header">
                            <div class="pr-title-area" style="display: flex; flex-direction: column; gap: 0.4rem;">
                                <a href="/repositories/?id=${pr.repo_id}" class="pr-repo" style="font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.5px; display: inline-flex; align-items: center; gap: 0.25rem;">
                                    <i class="ph ph-git-repository"></i> ${pr.repo_name}
                                </a>
                                <h3 style="margin: 0; font-size: 1.25rem;">
                                    <a href="${prLink}" target="_blank">${pr.title || `PR #${pr.github_pr_id}`}</a>
                                    <i class="ph ph-arrow-square-out" style="font-size: 0.85rem; color: var(--text-secondary);"></i>
                                </h3>
                                <div style="font-size: 0.75rem; color: var(--text-secondary);">PR Number: #${pr.github_pr_id}</div>
                            </div>
                            <span class="badge ${badgeClass}" style="padding: 0.4rem 0.8rem; font-size: 0.75rem; border-radius: 20px;">${statusLabel}</span>
                        </div>
                        <p class="text-secondary" style="font-size: 0.95rem; margin-top: 0.75rem; margin-bottom: 0.5rem; line-height: 1.5; display: flex; align-items: center;">
                            ${pr.issue_title ? `Addresses issue: <strong>${pr.issue_title}</strong>` : 'General contribution (no linked issue).'}
                            ${difficultyBadge}
                        </p>
                        <div class="pr-meta-info">
                            <span><i class="ph ph-clock text-secondary"></i> <span class="text-secondary">${dateText}</span></span>
                            <span><i class="ph ph-user text-primary"></i> Contributed by: <strong class="text-primary">${pr.github_username || pr.user_id}</strong></span>
                            <span><i class="ph ph-sparkle text-warning"></i> Points status: ${pointsText}</span>
                        </div>
                    `;
                    prsListContainer.appendChild(card);
                });
            };

            statusFilter.addEventListener('change', (e) => {
                activeTab = e.target.value;
                renderPRs();
            });

            searchInput.addEventListener('input', renderPRs);
            repoFilter.addEventListener('change', renderPRs);

            let currentPage = 1;
            let currentLimit = 10;

            const loadPRs = async () => {
                try {
                    const urlParams = new URLSearchParams(window.location.search);
                    const queryUserId = urlParams.get('user_id') || 'me';
                    
                    const res = await API.fetchUserPRs(queryUserId, currentPage, currentLimit);
                    allPRs = res.data || [];

                    // Populate repositories filter option list
                    const repoNames = {};
                    allPRs.forEach(pr => {
                        repoNames[pr.repo_name] = true;
                    });
                    
                    repoFilter.innerHTML = '<option value="">All Repositories</option>';
                    Object.keys(repoNames).sort().forEach(name => {
                        const opt = document.createElement('option');
                        opt.value = name;
                        opt.textContent = name;
                        repoFilter.appendChild(opt);
                    });

                    if (queryUserId !== 'me') {
                        document.getElementById('prs-page-title').textContent = "User's PRs";
                    } else {
                        document.getElementById('prs-page-title').textContent = "My PRs";
                    }

                    renderPRs();
                    
                    Components.renderPagination('prs-pagination', res.meta, (p) => {
                        currentPage = p;
                        loadPRs();
                    }, (l) => {
                        currentLimit = l;
                        currentPage = 1;
                        loadPRs();
                    });
                } catch(e) {
                    console.error("Failed to load PRs", e);
                    prsListContainer.innerHTML = `
                        <div class="text-center py-4 text-secondary" style="grid-column: 1 / -1; display: flex; flex-direction: column; align-items: center;">
                            <i class="ph ph-warning-circle" style="font-size: 2.5rem; color: var(--danger-color);"></i>
                            <p class="mt-1">Failed to fetch pull requests from server.</p>
                        </div>
                    `;
                }
            };

            const checkStatusAndRender = (status) => {
                const user = API.getCurrentUser();
                if (user && (user.is_admin || user.is_super_admin)) {
                    return false;
                }
                if (status === 'PASSIVE') {
                    const mainContent = document.querySelector('.main-content');
                    if (mainContent) {
                        mainContent.innerHTML = `
                            <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; flex-grow: 1; min-height: 60vh; text-align: center; padding: 2rem;">
                                <i class="ph ph-hourglass-high" style="font-size: 4rem; color: var(--warning-color); animation: pulse 2s infinite; margin-bottom: 1.5rem;"></i>
                                <h2 style="font-size: 2rem; font-weight: 700; color: white; margin-bottom: 1rem;">Event has not started yet.</h2>
                                <p class="text-secondary" style="max-width: 450px; font-size: 1.1rem; line-height: 1.6; margin: 0;">Interaction is disabled until the event starts. Please check back later!</p>
                            </div>
                        `;
                    }
                    return true;
                }
                return false;
            };

            const checkEventStatus = async () => {
                try {
                    const data = await API.request('/event/status');
                    const status = data.status || 'PASSIVE';
                    sessionStorage.setItem("event_status", status);
                    return checkStatusAndRender(status);
                } catch (e) {
                    console.error("Failed to load event status:", e);
                    return checkStatusAndRender('PASSIVE');
                }
            };

            const isPassive = await checkEventStatus();
            if (isPassive) {
                window.addEventListener('eventStatusLoaded', (e) => {
                    if (e.detail === 'ACTIVE') {
                        window.location.reload();
                    }
                });
                return;
            }

            window.addEventListener('eventStatusLoaded', (e) => {
                if (e.detail === 'PASSIVE') {
                    checkStatusAndRender('PASSIVE');
                }
            });

            await loadPRs();
        });
    </script>
